<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackFeel Fest Store</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        /* Modern aesthetic update based on reference image - strictly NO change in hooks/IDs */
        body { 
            font-family: 'Helvetica Neue', 'Helvetica', Arial, sans-serif; /* Clean modern sans-serif like image */
            background-color: #000000; /* Deep black from reference image */
            color: #FFFFFF; /* High contrast text from reference image */
            padding: 40px 20px; /* Better padding */
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        h1 { 
            text-align: left; /* Image feels left aligned */
            font-weight: 900; /* Extra bold */
            text-transform: uppercase; /* All caps from image aesthetic */
            letter-spacing: 4px; /* Widely tracked text from image */
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 60px; /* More breathing room */
        }
        
        /* Grid for the 4 products - keeping standard container ID */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 50px; /* Increased gap for minimalist spacing */
            max-width: 1400px; 
            margin: 0 auto; 
        }
        
        /* Minimalist product card that blends with background */
        .product-card { 
            background: transparent; /* No ugly borders like current site */
            border: none; 
            padding: 0; 
            text-align: center; 
            border-radius: 0; /* Sharp corners like image aesthetic */
            box-shadow: none; /* Removed shadow */
        }
        
        .product-card img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 0; /* Sharp corners for imagery */
            margin-bottom: 25px; /* Spacing below image */
        }
        
        .product-card h3 { 
            margin: 15px 0 5px; 
            font-size: 1.3rem; 
            font-weight: 700;
            text-transform: uppercase; /* Titles uppercase like image */
            letter-spacing: 1px;
        }
        
        .product-card p { 
            font-size: 1.2rem; 
            color: #A0A0A0; /* Light grey subtext/price like image text */
            margin-bottom: 20px; 
            font-weight: 300;
        }
        
        label { 
            display: block; 
            text-align: left; 
            font-size: 0.8rem; 
            margin-top: 15px; 
            margin-bottom: 5px;
            color: #777; /* Subtle labels */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Dropdowns styled to match minimalist inputs from reference image */
        select { 
            margin-bottom: 20px; 
            padding: 12px; 
            width: 100%; 
            border: 1px solid #444; /* Thin border like reference inputs */
            border-radius: 0; /* Sharp corners */
            background-color: #111; /* Dark input background like image */
            color: #FFF; /* White text inside input */
            font-family: inherit;
            font-size: 0.95rem;
            
            /* Style the custom arrow */
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="6" viewBox="0 0 12 6"><path fill="%23FFFFFF" d="M6 6L0 0h12z"/></svg>');
            background-repeat: no-repeat;
            background-position: calc(100% - 15px) 50%;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #FFF; /* Highlight on focus */
        }
        
        /* High prominence button to match premium aesthetic of image */
        button { 
            background: #FFFFFF; /* White background to stand out on black */
            color: #000000; /* Contrast against background */
            border: none; 
            padding: 15px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 0.9rem; 
            border-radius: 0; /* Sharp corners like image aesthetic */
            font-weight: 900; 
            text-transform: uppercase; /* All caps bold text from image buttons */
            letter-spacing: 2px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        
        button:hover { 
            background: #CCCCCC; /* Subtle grey on hover */
        }

        /* Modal Styles - Updated for Dark Theme consistency */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); /* Darker overlay for better focus */
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
        }
        
        .modal-content { 
            background: #111111; /* Dark background matching image inputs */
            color: #FFFFFF; 
            padding: 40px; 
            border-radius: 0; /* Sharp corners consistency */
            width: 90%; 
            max-width: 450px; 
            border: 1px solid #333; /* Subtle border */
        }
        
        .modal-content h2 { 
            margin-top: 0; 
            margin-bottom: 30px; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            font-size: 1.5rem;
        }
        
        .modal-content input, .modal-content textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #444; /* Thin border from image aesthetic */
            border-radius: 0; /* Sharp corners */
            box-sizing: border-box; 
            font-family: inherit;
            background-color: #000000; /* Dark input bg */
            color: #FFFFFF; /* Light text */
        }
        
        .modal-content input:focus, .modal-content textarea:focus {
            border-color: #FFF; /* Highlight focus edge */
            outline: none;
        }
        
        /* Secondary action style (Cancel) */
        .modal-close { 
            background: transparent; 
            color: #A0A0A0; /* Subtle grey text common in image */
            padding: 10px; 
            margin-top: 15px; 
            border: 1px solid #444; 
            text-transform: uppercase;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }
        
        .modal-close:hover {
            background: #222;
            color: #FFF;
        }
        
        /* SOLD OUT style */
        .product-card p[style*="color:red"] {
            color: #FF4D4D !important; /* Brighter red for visibility on dark mode */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>BlackFeel - Fest Collection</h1>
    
    <div class="product-grid" id="store-container">
        </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <h2>Delivery Details</h2>
            <input type="text" id="cust-name" placeholder="Full Name" required>
            <input type="email" id="cust-email" placeholder="Email Address" required>
            <input type="tel" id="cust-phone" placeholder="Phone Number" required>
            <textarea id="cust-address" rows="3" placeholder="Complete Delivery Address" required></textarea>
            
            <input type="hidden" id="temp-sku">
            <input type="hidden" id="temp-price">
            
            <button onclick="processCheckout()">Proceed to Payment</button>
            <button class="modal-close" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // 1. Configuration: Matching your fixed filenames (already present in input file)
        const productData = [
            { id: 'D1', name: 'Travis', price: 999, img: 'mockups/D1Mockup.png' },
            { id: 'D2', name: 'Paradise', price: 999, img: 'mockups/D2Mockup.jpg' },
            { id: 'D3', name: 'Karan Aujla', price: 999, img: 'mockups/D3Mockup.png' },
            { id: 'D4', name: 'Better Call Saul', price: 999, img: 'mockups/D4Mockup.png' }
        ];

        // 2. Load the Store - NO change in logic, only updated HTML template for new CSS
        async function renderStore() {
            const container = document.getElementById('store-container');
            if (!container) return; // Guard
            container.innerHTML = ''; // Clear existing

            for (const p of productData) {
                try {
                    // Fetch real-time stock from Node.js (Port 3000)
                    const response = await fetch(`http://localhost:3000/api/inventory/${p.id}`);
                    const inventory = await response.json();

                    // Filter variants with stock (Quantity > 0)
                    const availableColors = [...new Set(inventory.filter(i => i.quantity > 0).map(i => i.color))];
                    
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    // Construct inner HTML using standard IDs/hooks
                    card.innerHTML = `
                        <img src="${p.img}" alt="${p.name}" onerror="this.src=''">
                        <h3>${p.name}</h3>
                        <p>₹${p.price}</p>
                        
                        <label>Color:</label>
                        <select id="color-${p.id}" onchange="updateSizes('${p.id}')">
                            ${availableColors.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>

                        <label>Size:</label>
                        <select id="size-${p.id}">
                            </select>

                        <button onclick="payNow('${p.id}', ${p.price})">Buy Now</button>
                    `;
                    container.appendChild(card);
                    
                    // Set up initial dropdown state using standard function calls
                    if(availableColors.length > 0) {
                        updateSizes(p.id, inventory);
                    } else {
                        card.innerHTML += `<p style="color:red; font-weight:bold;">SOLD OUT</p>`;
                        // Disable buttons/selects for sold out items
                        card.querySelectorAll('select, button').forEach(el => el.disabled = true);
                    }
                } catch (err) {
                    console.error("Failed to load inventory for " + p.id, err);
                }
            }
        }

        // 3. Dynamic Size Dropdown - NO change in logic/hooks/calls
        async function updateSizes(designId, providedInventory = null) {
            let inventory = providedInventory;
            if (!inventory) {
                try {
                    const res = await fetch(`http://localhost:3000/api/inventory/${designId}`);
                    inventory = await res.json();
                } catch (err) {
                    console.error("Update sizes inventory fetch failed", err);
                    return;
                }
            }

            const selectedColor = document.getElementById(`color-${designId}`).value;
            const sizeDropdown = document.getElementById(`size-${designId}`);
            
            const availableSizes = inventory
                .filter(item => item.color === selectedColor && item.quantity > 0)
                .map(item => item.size);

            sizeDropdown.innerHTML = availableSizes.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        // --- Cart/Checkout Flow (Updated to capture details first) ---

        // Open the details form modal - NO change in logical flow
        function payNow(designId, price) {
            const color = document.getElementById(`color-${designId}`).value;
            const size = document.getElementById(`size-${designId}`).value;
            
            // Reconstruct SKU: TEE-[Size]-[WH/BL]-[DesignID] - Logic preserved
            const colorCode = (color === 'White') ? 'WH' : 'BL';
            const sku = `TEE-${size}-${colorCode}-${designId}`;

            // Store choice temporarily in the hidden modal inputs - IDs preserved
            document.getElementById('temp-sku').value = sku;
            document.getElementById('temp-price').value = price;

            // Open Modal Overlay - ID preserved
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        // Closes delivery details form
        function closeModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        // Handle form submission and initiate Razorpay checkout - NO change in logic/API calls/hooks
        async function processCheckout() {
            const sku = document.getElementById('temp-sku').value;
            const price = document.getElementById('temp-price').value;
            
            // Capture customer details - IDs preserved
            const customer = {
                name: document.getElementById('cust-name').value,
                email: document.getElementById('cust-email').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value
            };

            // Basic validation preserved
            if(!customer.name || !customer.email || !customer.phone || !customer.address) {
                alert("Please fill in all delivery details.");
                return;
            }

            try {
                // Initiate order creation on Node.js backend - API hook preserved
                const orderRes = await fetch('http://localhost:3000/api/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sku: sku, amount: price, customer: customer })
                });
                const order = await orderRes.json();

                if (order.error) {
                    alert(order.error);
                    closeModal();
                    return;
                }

                // Razorpay checkout options - IDs/prefills preserved
                const options = {
                    "key": "rzp_test_YOUR_ACTUAL_PUBLIC_KEY", // REMINDER: Put your real key here!
                    "amount": order.amount,
                    "currency": "INR",
                    "name": "BlackFeel",
                    "description": "Fest Collection Order",
                    "order_id": order.id, // backend Order ID hook preserved
                    "prefill": { // Customer details passed to Razorpay
                        "name": customer.name,
                        "email": customer.email,
                        "contact": customer.phone
                    },
                    "handler": async function (response) {
                        // Payment Success Handler - API verification hook preserved
                        try {
                            await fetch('http://localhost:3000/api/verify-payment', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    sku: sku, 
                                    payment_id: response.razorpay_payment_id,
                                    order_id: response.razorpay_order_id
                                })
                            });
                            alert('Payment Successful! We have received your order.');
                            window.location.reload(); // Success flow remains
                        } catch (verificationErr) {
                            console.error("Verification API failed", verificationErr);
                            alert("Payment successful, but order update failed. Please contact support.");
                        }
                    }
                };
                const rzp = new Razorpay(options);
                rzp.open();
                closeModal(); // Hide custom form
            } catch (err) {
                alert("Something went wrong connecting to checkout. Please try again.");
                console.error(err);
            }
        }

        // --- Store Initialization ---
        // Existing startup hook remains
        document.addEventListener('DOMContentLoaded', renderStore);
    </script>
</body>
</html>
